<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow map: website lead automation</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<style>
:root { --bg:#F5F7FA; --surface:#fff; --s2:#EDF1F6; --s3:#E1E7EF; --line:#DCE2EB; --text:#1A2233; --heading:#0A0E17; --muted:#586276;
  --brand:#0F7643; --accent:#34D67F; --soft:#E3F8EC; --cta-line:#C9EBD7; --wire:#B9C2CF;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif; --serif:"Newsreader",Georgia,serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { position: fixed; inset: 0; margin: 0; }
body { font: 12px/1.4 var(--sans); color: var(--text); background: var(--bg) radial-gradient(#CBD3DE 1px, transparent 1px) 0 0 / 20px 20px; cursor: grab; user-select: none; -webkit-user-select: none; }
body.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
svg.wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.wire { fill: none; stroke: var(--wire); stroke-width: 1.5; }
.goto-wire { fill: none; stroke: #9AA5B5; stroke-width: 1.3; stroke-dasharray: 5 5; }
.plus { fill: #fff; stroke: var(--wire); stroke-width: 1.2; } .plus-x { stroke: #8C96AC; stroke-width: 1.3; }
.card { position: absolute; width: 230px; min-height: 58px; display: flex; align-items: center; gap: 10px; padding: 10px 30px 10px 11px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(10,14,23,.05), 0 4px 12px -6px rgba(10,14,23,.12); }
.card .ic { flex: 0 0 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; }
.card .ic svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.card b { display: block; font-weight: 600; font-size: 12px; line-height: 1.3; color: var(--heading); }
.card i { display: block; font-style: normal; font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.card .dots { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #9AA5B5; }
.card .dots svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
.ic.contact, .ic.tag, .ic.note { background: var(--s2); color: var(--muted); }
.ic.opp { background: var(--brand); color: #fff; }
.ic.team { background: #1A2233; color: #fff; }
.ic.mail { background: var(--soft); color: var(--brand); }
.ic.task { background: #fff; color: var(--text); box-shadow: inset 0 0 0 1.3px var(--text); }
.ic.cond { background: var(--soft); color: var(--brand); }
.ic.wait { background: var(--s3); color: var(--muted); }
.ic.goto { background: #F1ECFB; color: #6B4FB8; }
.card.trig { flex-direction: column; align-items: stretch; gap: 0; padding: 0; min-height: 0; border-color: var(--heading); overflow: hidden; }
.card.trig .th { display: flex; align-items: center; gap: 10px; padding: 10px 11px; background: var(--heading); }
.card.trig .th .ic { background: var(--accent); color: #06130C; }
.card.trig .th small { display: block; font: 600 10px/1 var(--sans); color: var(--accent); letter-spacing: .02em; }
.card.trig .th b { color: #F2F5F9; }
.card.trig .tf { padding: 8px 11px; font-size: 10.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
.card.trig .ts { padding: 6px 11px; font-size: 10.5px; font-weight: 600; color: var(--brand); text-align: right; }
.card.split { border-color: var(--cta-line); }
.hdr { position: absolute; width: 230px; height: 58px; padding: 9px 10px 8px; text-align: center; border-radius: 10px; background: #fff; border: 1px solid var(--line);
  box-shadow: inset 0 -3px 0 var(--accent), 0 4px 12px -8px rgba(10,14,23,.15); }
.hdr b { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--brand); }
.hdr b svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
.hdr i { display: block; font-style: normal; font-size: 10.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.end { position: absolute; width: 56px; height: 24px; border-radius: 999px; background: var(--s3); color: var(--muted); font: 700 10px/24px var(--sans); text-align: center; letter-spacing: .06em; }
.wtitle { position: absolute; white-space: nowrap; }
.wtitle small { display: inline-flex; align-items: center; gap: 8px; font: 600 17px/1 var(--sans); color: var(--brand); }
.wtitle small::before { content: ""; width: 26px; height: 1.5px; background: var(--accent); }
.wtitle h2 { margin-top: 10px; font: 500 46px/1.1 var(--serif); letter-spacing: -.015em; color: var(--heading); display: flex; align-items: center; gap: 12px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font: 600 13px/1.3 var(--sans); background: var(--soft); color: var(--brand); }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.tag.build { background: var(--s3); color: var(--text); } .tag.build::before { background: #F5B740; }
.tag.plan { background: #fff; color: var(--muted); border: 1px solid var(--line); } .tag.plan::before { background: var(--s3); border: 1px solid #B9C2CF; }
.link { position: absolute; width: 20px; height: 20px; border-radius: 6px; background: #F1ECFB; color: #6B4FB8; display: grid; place-items: center; }
.link svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; }

.ui { position: fixed; z-index: 10; display: flex; gap: 4px; align-items: center; padding: 5px; border-radius: 999px; background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 24px -12px rgba(10,14,23,.3); }
.ui button { border: 0; background: transparent; min-width: 34px; height: 34px; padding: 0 12px; border-radius: 999px; font: 600 12.5px/1 var(--sans); color: var(--heading); cursor: pointer; }
.ui button:hover, .ui button.on { background: var(--soft); color: var(--brand); }
.ui button:focus-visible { outline: 2px solid var(--brand); }
#zoombar { right: 16px; bottom: 16px; } #pct { min-width: 48px; text-align: center; font: 600 12px/1 var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
#navbar { left: 16px; bottom: 16px; flex-wrap: wrap; max-width: calc(100vw - 270px); }
#top { left: 16px; top: 16px; display: block; padding: 10px 16px; border-radius: 14px; }
#top b { display: block; font: 500 17px/1.2 var(--serif); color: var(--heading); }
#top span { font: 500 11px/1.4 var(--sans); color: var(--muted); }
#top .back { display: block; width: fit-content; margin-top: 6px; font: 600 12.5px/1.3 var(--sans); color: var(--brand); text-decoration: none; }
#top .back:hover { text-decoration: underline; }
#legend { right: 16px; top: 16px; border-radius: 14px; padding: 8px 12px; gap: 12px; flex-wrap: wrap; max-width: 560px; font: 500 11px/1 var(--sans); color: var(--muted); }
#legend span { display: inline-flex; align-items: center; gap: 5px; }
#legend .ic { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; }
#legend .ic svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; }
@media (max-width: 1100px) { #legend { display: none; } }
@media (max-width: 640px) { #navbar { max-width: calc(100vw - 32px); bottom: 66px; } #top span { display: none; } }
</style></head><body>
